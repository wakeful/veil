version: "2"
linters:
  default: all
  disable:
    - exhaustruct # deprecated (since v2.13.0)
    - gomodguard # deprecated (since v2.12.0)
    - tagliatelle
    - wsl # deprecated (since v2.2.0)
  settings:
    depguard:
      rules:
        main:
          allow:
            - $gostd
            - github.com/aws/aws-sdk-go-v2/aws
            - github.com/aws/aws-sdk-go-v2/config
            - github.com/aws/aws-sdk-go-v2/service/iam
            - golang.org/x/sync/errgroup
  exclusions:
    generated: disable
    rules:
      - linters:
          - err113
          - exhaustruct_v5
          - funlen
          - goconst
          - varnamelen
        path: _test.go
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
